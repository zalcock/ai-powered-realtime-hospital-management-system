version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: medflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ChangeMe123!}
      MONGO_INITDB_DATABASE: hospital
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--authenticationDatabase", "admin", "-u", "admin", "-p", "ChangeMe123!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MONGO_URI: mongodb://admin:ChangeMe123!@mongodb:27017/hospital?authSource=admin
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GEMINI_KEY: ${GEMINI_KEY}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      POLAR_PRODUCT_ID: ${POLAR_PRODUCT_ID}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
    volumes:
      - ./backend/uploads:/app/uploads:rw
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "bun", "--eval", "await (await import('http')).get('http://localhost:5000/').then(r => r.status === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${BACKEND_URL:-http://localhost:5000}
    networks:
      - medflow-network

  # Optional: NGINX reverse proxy for production
  # Uncomment to use NGINX for SSL termination and load balancing
  # nginx:
  #   image: nginx:alpine
  #   container_name: medflow-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - medflow-network

volumes:
  mongodb_data:
    driver: local

networks:
  medflow-network:
    driver: bridge
